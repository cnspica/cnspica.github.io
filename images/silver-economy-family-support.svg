    <path d="M30 33h20m-10-10v20" stroke="#588b79" stroke-width="5" stroke-linecap="round"/>
    <text x="68" y="43" fill="#354a43" font-family="sans-serif" font-size="27">每一次代劳，需求就隐身</text>
  </g>

