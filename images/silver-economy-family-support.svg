<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">银发经济的隐形竞争</title>
  <desc id="description">一位长者和一位成年子女一起看手机，旁边列出挂号、缴费、出行三个常见生活场景。</desc>
  <rect width="1200" height="720" rx="36" fill="#f7f1e7"/>
  <circle cx="1020" cy="145" r="95" fill="#f2d6a5"/>
  <path d="M0 575c180-54 305-36 470 8 174 47 340 30 730-63v200H0z" fill="#e7e2d4"/>

  <text x="72" y="106" fill="#263b36" font-family="sans-serif" font-size="28" font-weight="700" letter-spacing="3">SILVER ECONOMY · 商业逻辑</text>
  <text x="72" y="186" fill="#263b36" font-family="sans-serif" font-size="56" font-weight="700">真正的竞争对手</text>
  <text x="72" y="254" fill="#263b36" font-family="sans-serif" font-size="56" font-weight="700">不是同行，是家人的耐心</text>
  <path d="M72 282h170" stroke="#df825b" stroke-width="8" stroke-linecap="round"/>

