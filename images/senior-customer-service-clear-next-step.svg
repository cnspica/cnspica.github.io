<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">一句能复述的客服答复</title>
  <desc id="description">客服人员戴着耳机耐心倾听电话，并在纸上记录清晰的后续安排。</desc>
  <rect width="1200" height="720" rx="36" fill="#f5f2e9"/>
  <circle cx="1038" cy="142" r="112" fill="#f0d7b1"/>
  <path d="M0 563c213-69 378-29 580 1 199 29 389-6 620-55v211H0z" fill="#e5e8df"/>

  <text x="72" y="98" fill="#60796c" font-family="sans-serif" font-size="25" font-weight="700" letter-spacing="3">服务方法 · 沟通设计</text>
  <text x="72" y="180" fill="#293d36" font-family="sans-serif" font-size="55" font-weight="700">别急着念工单号</text>
  <text x="72" y="247" fill="#293d36" font-family="sans-serif" font-size="55" font-weight="700">先说清下一步怎么办</text>
  <path d="M74 276h158" stroke="#dc8965" stroke-width="8" stroke-linecap="round"/>

  <g transform="translate(78 330)">
    <rect width="415" height="205" rx="24" fill="#fffdf8"/>
    <text x="30" y="48" fill="#76827a" font-family="sans-serif" font-size="21" font-weight="700">一通让人安心的电话</text>
    <g transform="translate(32 78)">
      <circle cx="20" cy="20" r="20" fill="#e8b28e"/>
      <path d="M11 20h18m-9-9v18" stroke="#fffdf8" stroke-width="4" stroke-linecap="round"/>
      <text x="60" y="28" fill="#354a43" font-family="sans-serif" font-size="25">先听完，再确认</text>
    </g>
    <g transform="translate(32 134)">
      <circle cx="20" cy="20" r="20" fill="#dce8df"/>
      <path d="m11 20 7 7 13-15" fill="none" stroke="#638c77" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="28" fill="#354a43" font-family="sans-serif" font-size="25">说清时间和安排</text>
    </g>
  </g>

  <g transform="translate(595 308)">
    <ellipse cx="249" cy="291" rx="224" ry="24" fill="#d3d9d0"/>
    <path d="M112 270c7-85 36-128 100-143l88 20 26 123z" fill="#658c78"/>
    <path d="M140 123c0-54 32-89 78-89 45 0 71 35 71 83 0 34-17 58-43 75l-69-7c-24-12-37-31-37-62z" fill="#e1b794"/>
    <path d="M140 105c8-47 38-73 80-73 36 0 62 22 69 60-27-3-50-17-66-40-18 25-43 40-83 45z" fill="#475b51"/>
    <path d="M174 143c13 7 26 7 38 0" fill="none" stroke="#835d49" stroke-width="4" stroke-linecap="round"/>
    <path d="m157 192-42 70m132-72 47 71" fill="none" stroke="#e1b794" stroke-width="18" stroke-linecap="round"/>
    <path d="M275 88c0-39 28-68 65-68s65 29 65 68" fill="none" stroke="#43594f" stroke-width="11"/>
    <rect x="394" y="76" width="19" height="53" rx="9" fill="#43594f"/>
    <path d="M402 129c-4 22-18 34-41 37" fill="none" stroke="#43594f" stroke-width="7" stroke-linecap="round"/>
    <circle cx="353" cy="166" r="7" fill="#df8966"/>

    <path d="M229 252h241l20 83H211z" fill="#c99d78"/>
    <path d="M222 260h244l-12 42H234z" fill="#f6f1e7"/>
    <rect x="275" y="217" width="113" height="74" rx="9" transform="rotate(-5 275 217)" fill="#fffdf8"/>
    <path d="m292 240 12 12 23-26m-32 44 14 2m18-5 37-3" fill="none" stroke="#668b78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M311 279l35-3" stroke="#d7a47f" stroke-width="4" stroke-linecap="round"/>
    <rect x="183" y="217" width="42" height="57" rx="10" transform="rotate(-23 183 217)" fill="#43594f"/>
    <path d="M193 227c7-5 15-7 22-6" fill="none" stroke="#d9e8dd" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="72" y="647" fill="#354a43" font-family="sans-serif" font-size="30" font-weight="700">能复述的结论，才是带得走的服务。</text>
  <text x="1127" y="650" fill="#718078" font-family="sans-serif" font-size="18" text-anchor="end">LISTEN · CLARIFY · CONFIRM</text>
</svg>
